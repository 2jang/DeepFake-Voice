experiment: aasist_c2
data_combo: C2

model:
  name: aasist

data:
  train_manifest: manifests/C2/train.csv
  dev_manifest: manifests/C2/dev.csv
  eval_manifests:
    T1: manifests/T1_speechfake_ko_test.csv
    T2: manifests/T2_koaad_holdout.csv
    T3: manifests/T3_mlaad_test.csv
  num_samples: 64000
  num_workers: 4

training:
  optimizer: adam
  lr: 0.0001
  batch_size: 32
  epochs: 50
  early_stopping_patience: 10
  weight_decay: 0.0001
  class_weights: [1.0, 1.0]

seed: 42
output_root: experiments
