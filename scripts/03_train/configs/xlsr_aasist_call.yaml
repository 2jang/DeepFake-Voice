# 실험 D-1: XLS-R (frozen) → AASIST-style attention head, C_all
# SSL 베이스라인: 300M frozen feature extractor + ~296K trainable head
experiment: xlsr_aasist_call
data_combo: C_all

model:
  name: xlsr_aasist

data:
  train_manifest: manifests/C_all/train.csv
  dev_manifest: manifests/C_all/dev.csv
  eval_manifests:
    T1: manifests/T1_speechfake_ko_test.csv
    T2: manifests/T2_koaad_holdout.csv
    T3: manifests/T3_mlaad_test.csv
  num_samples: 64000
  num_workers: 4

training:
  optimizer: adam
  lr: 0.0001
  batch_size: 8
  epochs: 50
  early_stopping_patience: 10
  weight_decay: 0.0001
  class_weights: [1.0, 1.0]

seed: 42
output_root: experiments
