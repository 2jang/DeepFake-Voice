# 실험 D-2: XLS-R (frozen) → FC, C_all
# SSL feature 순수 효과 측정: 300M frozen + ~2K trainable FC
experiment: xlsr_fc_call
data_combo: C_all

model:
  name: xlsr_fc

data:
  train_manifest: manifests/C_all/train.csv
  dev_manifest: manifests/C_all/dev.csv
  eval_manifests:
    T1: manifests/T1_speechfake_ko_test.csv
    T2: manifests/T2_koaad_holdout.csv
    T3: manifests/T3_mlaad_test.csv
  num_samples: 64000
  num_workers: 4

training:
  optimizer: adam
  lr: 0.001
  batch_size: 8
  epochs: 50
  early_stopping_patience: 10
  weight_decay: 0.0001
  class_weights: [1.0, 1.0]

seed: 42
output_root: experiments
