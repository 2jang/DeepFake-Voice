# 실험 C-1: SpecRNet + C_all + 2초 입력
# 극단적으로 짧은 발화에서의 탐지 성능 테스트
experiment: specrnet_call_2sec
data_combo: C_all

model:
  name: specrnet

data:
  train_manifest: manifests/C_all/train.csv
  dev_manifest: manifests/C_all/dev.csv
  eval_manifests:
    T1: manifests/T1_speechfake_ko_test.csv
    T2: manifests/T2_koaad_holdout.csv
    T3: manifests/T3_mlaad_test.csv
  num_samples: 32000    # 2초 × 16kHz
  num_workers: 4

training:
  optimizer: adam
  lr: 0.0001
  batch_size: 64
  epochs: 50
  early_stopping_patience: 10
  weight_decay: 0.0001
  class_weights: [1.0, 1.0]

seed: 42
output_root: experiments
