# 실험 B-4: SpecRNet + C_all + MUSAN + Codec 조합 증강
# MUSAN noise 50% + Codec 30% 독립 적용 (양쪽 모두 적용될 수 있음)
experiment: specrnet_call_aug_both
data_combo: C_all

model:
  name: specrnet

data:
  train_manifest: manifests/C_all/train.csv
  dev_manifest: manifests/C_all/dev.csv
  eval_manifests:
    T1: manifests/T1_speechfake_ko_test.csv
    T2: manifests/T2_koaad_holdout.csv
    T3: manifests/T3_mlaad_test.csv
    T4: manifests/T4_asvspoof19_la_eval.csv
    T5: manifests/T5_asvspoof21_df_eval.csv
    T6: manifests/T6_asvspoof21_la_eval.csv
    T7: manifests/T7_cdadd.csv
    T8: manifests/T8_inthewild.csv
  num_samples: 64000
  num_workers: 4

training:
  optimizer: adam
  lr: 0.0001
  batch_size: 64
  epochs: 50
  early_stopping_patience: 10
  weight_decay: 0.0001
  class_weights: [1.0, 1.0]

augmentation:
  musan_dir: data/musan/musan
  musan_snr_range: [10, 20]
  musan_prob: 0.5
  codec: mp3
  codec_bitrate: "64k"
  codec_prob: 0.3
  codec_cache_dir: data/codec_cache/mp3_64k

seed: 42
output_root: experiments
