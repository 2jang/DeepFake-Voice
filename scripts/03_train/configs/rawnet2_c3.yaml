experiment: rawnet2_c3
data_combo: C3

model:
  name: rawnet2

data:
  train_manifest: manifests/C3/train.csv
  dev_manifest: manifests/C3/dev.csv
  eval_manifests:
    T1: manifests/T1_speechfake_ko_test.csv
    T2: manifests/T2_koaad_holdout.csv
    T3: manifests/T3_mlaad_test.csv
  num_samples: 64000
  num_workers: 8

training:
  optimizer: adam
  lr: 0.0001
  batch_size: 320
  epochs: 50
  early_stopping_patience: 10
  weight_decay: 0.0001
  class_weights: [1.0, 1.0]

seed: 42
output_root: experiments
